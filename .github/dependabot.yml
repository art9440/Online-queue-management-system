version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]

  # Dockerfiles: golang/alpine/node/nginx tags and their pinned digests.
  - package-ecosystem: docker
    directories:
      - /services/*
      - /frontend
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]

  # postgres/redis images in docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-packages:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
