name: Full CI

on:
  push:        
    pull_request 

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install deps
        run: go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Test with coverage
        run: go test ./... -coverprofile=coverage.out -count=1

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    if: hashFiles('frontend/package.json') != ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          cd frontend
          npm ci

      - name: Lint
        run: |
          cd frontend
          npm run lint

      - name: Test
        run: |
          cd frontend
          npm test -- --watchAll=false

      - name: Build
        run: |
          cd frontend
          npm run build

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  load-tests:
    name: Load Tests (JMeter)
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JMeter
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          mv apache-jmeter-5.6.3 jmeter

    
      # APP_ENV=test нужен для тестового режима 
      - name: Start services
        run: |
          APP_ENV=test docker compose up -d --build

      - name: Wait for services
        run: |
          for i in {1..20}; do
            curl -s http://localhost:8081/health && break
            sleep 2
          done

      - name: Run JMeter test
        run: |
          ./jmeter/bin/jmeter \
            -n \
            -t tests/load_test.jmx \
            -l results.jtl \
            -e \
            -o report

      - name: Check results
        run: |
          if grep -q '"success":false' results.jtl; then
            echo "Load test failed"
            exit 1
          fi

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-report
          path: report/