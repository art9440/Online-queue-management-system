name: Full CI

on:
  pull_request:

jobs:
  lint:
    name: Lint (Go)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install deps
        run: go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20
        with:
          version: v2.11.4

  go-tests:
    name: Tests (Go)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install deps
        run: go mod download

      - name: Test with coverage
        run: go test ./... -coverprofile=coverage.out -count=1

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [go-tests]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: go-coverage
          path: .

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  load-tests:
    name: Load Tests (JMeter)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JMeter
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          mv apache-jmeter-5.6.3 jmeter
        
      - name: Create CI env file
        run: |
          cat > .env <<EOF
          APP_ENV=test

          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=online_queue_db
          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432

          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=redis_password

          JWT_ACCESS_SECRET=test_access_secret
          JWT_REFRESH_SECRET=test_refresh_secret

          COOKIE_SECURE=false

          SMTP_HOST=localhost
          SMTP_PORT=1025
          SMTP_USERNAME=test
          SMTP_PASSWORD=test
          SMTP_FROM=test@example.com
          EOF

      - name: Start services
        run: |
          docker compose up -d --build

      - name: Wait for registration service
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:8081/health; then
              exit 0
            fi

            echo "Waiting for registration service..."
            sleep 2
          done

          echo "Registration service is not ready"
          docker compose ps
          docker compose logs
          exit 1

      - name: Run JMeter test
        run: |
          ./jmeter/bin/jmeter \
            -n \
            -t tests/load_tests.jmx \
            -l results.jtl \
            -e \
            -o report

      - name: Check results
        run: |
          if grep -q '"success":false' results.jtl; then
            echo "Load test failed"
            exit 1
          fi

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-report
          path: report/

  frontend-tests:
    name: Frontend E2E tests (cypress)
    runs-on: ubuntu-latest 
    needs: [lint, go-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci 

      - name: Create CI env file for frontend
        run: |
          cat > frontend/cypress.env.json <<EOF
          {
            "API_REGISTRATION": "http://localhost:8081",
            "API_AUTH": "http://localhost:8082",
            "API_BASE": "http://localhost:5173",

            "DB_HOST": "postgres",
            "DB_PORT": 5432,
            "DB_NAME": "online_queue_db",
            "DB_USER": "postgres",
            "DB_PASSWORD": "postgres"
          }
          EOF
      
      - name: Start services
        run: |
          docker compose up -d --build

      - name: Wait for registration service
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:8081/health; then
              exit 0
            fi

            echo "Waiting for registration service..."
            sleep 2
          done

          echo "Registration service is not ready"
          docker compose ps
          docker compose logs
          exit 1
      
      - name: Wait for auth service
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:8082/health; then
              exit 0
            fi
            echo "Waiting for auth service..."
            sleep 2
          done
          echo "Auth service is not ready"
          exit 1

      - name: Start frontend
        working-directory: frontend
        run: npm run dev -- --host 0.0.0.0 &

      - name: Wait for frontend
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:5173; then
              exit 0
            fi
            echo "Waiting for frontend..."
            sleep 2
          done
          echo "Frontend is not ready"
          exit 1

      - name: Run cypress E2E tests
        working-directory: frontend
        run: |
          npx cypress run --spec "cypress/e2e/**/*.cy.js"
