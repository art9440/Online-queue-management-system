name: Full CI

on:
  pull_request:

jobs:
  lint:
    name: Lint (Go)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install deps
        run: go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20
        with:
          version: v2.11.4

  go-tests:
    name: Tests (Go)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install deps
        run: go mod download

      - name: Test with coverage
        run: go test ./... -coverprofile=coverage.out -count=1

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  load-tests:
    name: Load Tests (JMeter)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JMeter
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          mv apache-jmeter-5.6.3 jmeter

      - name: Start services
        run: |
          APP_ENV=test docker compose up -d --build

      - name: Wait for registration service
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:8081/health; then
              exit 0
            fi

            echo "Waiting for registration service..."
            sleep 2
          done

          echo "Registration service is not ready"
          docker compose ps
          docker compose logs
          exit 1

      - name: Run JMeter test
        run: |
          ./jmeter/bin/jmeter \
            -n \
            -t tests/load_tests.jmx \
            -l results.jtl \
            -e \
            -o report

      - name: Check results
        run: |
          if grep -q '"success":false' results.jtl; then
            echo "Load test failed"
            exit 1
          fi

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-report
          path: report/