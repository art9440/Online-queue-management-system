# Build stage of 12-factor V: every commit to main and every v* tag produces one immutable
# image per service in GHCR. A release = these images (IMAGE_TAG) + config from .env;
# run = `docker compose -f docker-compose.yml pull && up -d` without building anything.
name: Release images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            context: .
            dockerfile: services/auth/auth.Dockerfile
          - service: registration
            context: .
            dockerfile: services/registration/registration.Dockerfile
          - service: branches
            context: .
            dockerfile: services/branches/branches.Dockerfile
          - service: booking
            context: .
            dockerfile: services/booking/booking.Dockerfile
          - service: bot
            context: .
            dockerfile: services/bot/bot.Dockerfile
          - service: scheduler
            context: .
            dockerfile: services/scheduler/scheduler.Dockerfile
          - service: migrate
            context: .
            dockerfile: services/migrate/migration.Dockerfile
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: short commit SHA always; vX.Y.Z and X.Y for release tags; latest for main.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/oqms-${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
