apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: oqms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: auth-service:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_NAME
              value: auth
          envFrom:
            - configMapRef: { name: oqms-config}
            - secretRef: { name: oqms-secrets}
          ports:
            - name: http
              containerPort: 8082
          readinessProbe:
            httpGet: { path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
