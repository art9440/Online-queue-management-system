apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking
  namespace: oqms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking
  template:
    metadata:
      labels:
        app: booking
    spec:
      containers:
        - name: booking
          image: booking-service:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_NAME
              value: booking
          envFrom:
            - configMapRef: { name: oqms-config}
            - secretRef: { name: oqms-secrets}
          ports:
            - name: http
              containerPort: 8084
          readinessProbe:
            httpGet: { path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
