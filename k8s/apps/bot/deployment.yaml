apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot
  namespace: oqms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bot
  template:
    metadata:
      labels:
        app: bot
    spec:
      containers:
        - name: bot
          image: bot-service:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_NAME
              value: bot
          envFrom:
            - configMapRef: { name: oqms-config }
            - secretRef: { name: oqms-secrets }
          ports:
            - name: http
              containerPort: 8085
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
