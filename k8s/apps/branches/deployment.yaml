apiVersion: apps/v1
kind: Deployment
metadata:
  name: branches
  namespace: oqms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: branches
  template:
    metadata:
      labels:
        app: branches
    spec:
      containers:
        - name: branches
          image: branches-service:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_NAME
              value: branches
          envFrom:
            - configMapRef: { name: oqms-config }
            - secretRef: { name: oqms-secrets }
          ports:
            - name: http
              containerPort: 8083
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
