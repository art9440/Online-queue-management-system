apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: oqms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: frontend-service:v1
          imagePullPolicy: IfNotPresent 
          envFrom:
            - configMapRef: { name: frontend-config }
          ports:
            - name: http
              containerPort: 8080   
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
