apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration
  namespace: oqms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registration
  template:
    metadata:
      labels:
        app: registration
    spec:
      containers:
        - name: registration
          image: registration-service:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_NAME
              value: registration
          envFrom:
            - configMapRef: { name: oqms-config }
            - secretRef: { name: oqms-secrets }
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
