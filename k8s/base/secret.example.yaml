# Template: cp secret.example.yaml secret.yaml and fill in real values. secret.yaml is not committed.
apiVersion: v1
kind: Secret
metadata:
  name: oqms-secrets
  namespace: oqms
type: Opaque
# stringData takes plain text; Kubernetes stores it base64-encoded.
stringData:
  # PostgreSQL: POSTGRES_PASSWORD (container) and DB_PASSWORD (clients) must match
  POSTGRES_PASSWORD: "change-me"
  DB_PASSWORD: "change-me"
  # Redis
  REDIS_PASSWORD: "change-me"
  # Auth: JWT signing keys
  JWT_ACCESS_SECRET: "change-me"
  JWT_REFRESH_SECRET: "change-me"
  # Email: for Gmail an app password, not the account password
  SMTP_PASS: "change-me"
  # Optional: Google Calendar OAuth (also needs GOOGLE_CLIENT_ID in the ConfigMap)
  GOOGLE_CLIENT_SECRET: ""
  # Optional: Telegram bot; empty token disables the bot
  TELEGRAM_BOT_TOKEN: ""
