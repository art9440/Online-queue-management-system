# Single entry point: http://oqms.local (port 80).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: oqms
  namespace: oqms
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: oqms.local
      allowedRoutes:
        namespaces:
          from: Same
