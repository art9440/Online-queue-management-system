services:
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: online_queue_jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - online_queue_network

networks:
  online_queue_network:
    external: true
